[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "scvi-tools-mcp"
description = "MCP server for scvi-tools - deep probabilistic analysis of single-cell omics data"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dynamic = [ "version" ]
dependencies = [
  "fastmcp[server]>=3",
  "pydantic>=2",
]
optional-dependencies.scib = [ "scib-metrics>=0.5" ]
optional-dependencies.scvi = [ "scvi-tools>=1" ]
optional-dependencies.scviva = [ "scviva-tools>=0.1" ]
scripts.scvi-tools-mcp = "scvi_tools_mcp.main:run_app"

[dependency-groups]
dev = [
  "jupyter",
  "nbconvert>=7",
  "pre-commit",
  "pytest>=7",
  "pytest-asyncio>=0.21",
  "requests>=2.28",
  "ruff>=0.1",
]
doc = [
  "furo>=2023",
  "myst-parser>=2",
  "sphinx>=7",
]

[tool.hatch]
version.path = "src/scvi_tools_mcp/__init__.py"
build.targets.wheel.packages = [ "src/scvi_tools_mcp" ]
build.targets.wheel.artifacts = [ "src/scvi_tools_mcp/knowledge/**/*" ]
build.targets.sdist.include = [ "docs/", "src/", "tests/" ]

[tool.ruff]
line-length = 120
extend-exclude = [ "tests/fixtures/*.ipynb" ]
lint.select = [ "E", "F", "I" ]

[tool.pytest]
ini_options.testpaths = [ "tests" ]
ini_options.pythonpath = [ "src" ]
