name: Sync Hugging Face Hub

on:
  schedule:
    - cron: "0 6 1 */3 *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Refresh scvi-tools Hugging Face Hub snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -e . --group dev

      - name: Run Hugging Face hub scraper
        run: python scripts/scrape_huggingface_hub.py

      - name: Check for changes
        id: diff
        run: |
          git diff --quiet src/scvi_tools_mcp/knowledge/hub/ && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Create pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: sync scvi-tools Hugging Face hub snapshot"
          branch: chore/sync-huggingface-hub-${{ github.run_id }}
          title: "chore: sync scvi-tools Hugging Face hub snapshot"
          body: |
            Quarterly automated refresh of the scvi-tools Hugging Face Hub model registry.

            Run `python scripts/scrape_huggingface_hub.py` locally to reproduce.
          labels: automated
