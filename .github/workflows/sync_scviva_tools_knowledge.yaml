name: Sync scviva-tools Knowledge

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Update scviva-tools docs from YosefLab/scviva-tools main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install scviva-tools + dev deps
        run: pip install -e ".[scviva]" --group dev

      - name: Clone scviva-tools (latest main)
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/YosefLab/scviva-tools.git /tmp/scviva-tools
          git -C /tmp/scviva-tools sparse-checkout set docs/user_guide
          echo "Cloned scviva-tools at $(git -C /tmp/scviva-tools rev-parse --short HEAD)"

      - name: Check if update needed
        id: check
        run: |
          # Docstrings/signatures come from the installed PyPI release; the narrative
          # user-guide merge comes from the cloned main branch. Track both so a change
          # in either one (an unreleased main commit, or a new PyPI release with no doc
          # changes on main) triggers a re-sync.
          SHA=$(git -C /tmp/scviva-tools rev-parse --short HEAD)
          VERSION=$(python -c "import scviva; print(scviva.__version__)")
          KEY="${VERSION}+${SHA}"
          SYNCED=$(cat src/scvi_tools_mcp/knowledge/scviva_tools/.last_synced_commit 2>/dev/null || echo "none")
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
          echo "synced=$SYNCED" >> "$GITHUB_OUTPUT"
          if [ "$SYNCED" = "$KEY" ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Regenerate scviva-tools model/API knowledge
        if: steps.check.outputs.needed == 'true'
        run: python scripts/extract_scviva_api_docs.py --docs-dir /tmp/scviva-tools/docs/user_guide

      - name: Update last-synced commit
        if: steps.check.outputs.needed == 'true'
        env:
          KEY: ${{ steps.check.outputs.key }}
        run: echo "$KEY" > src/scvi_tools_mcp/knowledge/scviva_tools/.last_synced_commit

      - name: Check for changes
        if: steps.check.outputs.needed == 'true'
        id: diff
        run: |
          if git status --porcelain src/scvi_tools_mcp/knowledge/scviva_tools/ | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create pull request
        if: steps.check.outputs.needed == 'true' && steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: sync scviva-tools knowledge (scviva-tools ${{ steps.check.outputs.version }} @ ${{ steps.check.outputs.sha }})"
          branch: chore/sync-scviva-tools-knowledge-${{ github.run_id }}
          title: "chore: sync scviva-tools knowledge (scviva-tools ${{ steps.check.outputs.version }} @ ${{ steps.check.outputs.sha }})"
          body: |
            Automated model/API knowledge sync from YosefLab/scviva-tools.

            Installed PyPI release: scviva-tools@${{ steps.check.outputs.version }}
            Docs/main commit: YosefLab/scviva-tools@${{ steps.check.outputs.sha }}
            Previous synced key: ${{ steps.check.outputs.synced }}

            Re-runs `scripts/extract_scviva_api_docs.py` (docstrings from the installed
            release) with narrative user-guide docs merged in from main.
            Review changes before merging.
          labels: automated
