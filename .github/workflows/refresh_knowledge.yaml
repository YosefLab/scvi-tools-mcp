name: Refresh External Knowledge

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    name: Refresh GitHub issues/PRs/discussions, Discourse threads and websites
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -e . --group dev

      - name: Run scraper
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/scrape_external.py

      - name: Sync project websites (blog posts + pages)
        run: python scripts/sync_websites.py

      - name: Check for changes
        id: diff
        run: |
          # --porcelain also reports untracked files (e.g. a newly created snapshot file)
          if [ -z "$(git status --porcelain -- src/scvi_tools_mcp/knowledge/faq/ src/scvi_tools_mcp/knowledge/websites/)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: refresh external knowledge snapshot"
          branch: chore/refresh-knowledge-${{ github.run_id }}
          title: "chore: refresh external knowledge snapshot (${{ env.MONTH }})"
          body: |
            Monthly automated refresh of the GitHub issues, pull requests and Discussions snapshots
            (scvi-tools, scvi-tutorials, scviva-tools, scib-metrics, scvi-colab, scvi-hub-models), the Discourse
            thread snapshot, and the scvi-tools / scviva-tools website blog posts and pages.

            The snapshots accumulate: existing entries are kept and updated, new ones are added, and entries are
            only removed once their last activity is more than 3 years old. GitHub is fetched incrementally and
            resumes from the newest stored entry if a run hits the API rate limit.

            Website files are only added or updated, never deleted.

            Run `scripts/scrape_external.py` and `scripts/sync_websites.py` locally to reproduce.
          labels: automated
        env:
          MONTH: ${{ github.event.schedule && 'scheduled' || 'manual' }}
